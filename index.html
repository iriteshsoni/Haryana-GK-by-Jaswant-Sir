<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haryana GK Quiz - Chapter 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
.container{max-width:650px;margin:auto;padding:18px}
.header{background:#fff;border-radius:18px;padding:20px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
h1{margin:0 0 6px;font-size:25px}
.subtitle{color:#667085}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.progress{font-size:14px;color:#667085;margin-bottom:14px}
.question{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;border:2px solid #e4e7ec;background:#fff;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;cursor:pointer}
.option:hover{background:#f8fafc}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong{border-color:#dc2626;background:#fef2f2}
button{border:0;border-radius:12px;padding:13px 20px;font-size:17px;font-weight:700;cursor:pointer}
#nextBtn{width:100%;margin-top:14px;background:#2563eb;color:white}
#nextBtn:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}
.score{font-size:42px;font-weight:800;margin:18px 0}
.restart{background:#2563eb;color:#fff}
.hidden{display:none}
.footer{text-align:center;color:#98a2b3;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>हरियाणा GK Quiz</h1>
    <div class="subtitle">Chapter 2 • Jaswant Sir</div>
  </div>

  <div id="quizCard" class="card">
    <div id="progress" class="progress">Loading...</div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <button id="nextBtn" disabled>Next Question</button>
  </div>

  <div id="resultCard" class="card result hidden">
    <h2>Quiz Complete 🎉</h2>
    <div id="score" class="score"></div>
    <p id="message"></p>
    <button class="restart" onclick="restartQuiz()">Try Again</button>
  </div>

  <div class="footer">Haryana GK • Chapter 2</div>
</div>

<script>
let questions=[], current=0, score=0, answered=false;

async function loadQuiz(){
  try{
    const response=await fetch('./Chapter2.json');
    if(!response.ok) throw new Error('Chapter2.json not found');
    questions=await response.json();
    if(!Array.isArray(questions) || questions.length===0) throw new Error('No questions');
    shuffle(questions);
    showQuestion();
  }catch(e){
    document.getElementById('progress').textContent='Quiz load nahi ho paya.';
    document.getElementById('question').textContent='Chapter2.json check karein.';
    console.error(e);
  }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function showQuestion(){
  answered=false;
  const q=questions[current];
  document.getElementById('progress').textContent=`Question ${current+1} / ${questions.length}`;
  document.getElementById('question').textContent=q.question;
  const box=document.getElementById('options');
  box.innerHTML='';
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(65+i)+'. '+opt;
    b.onclick=()=>selectAnswer(i,b);
    box.appendChild(b);
  });
  const next=document.getElementById('nextBtn');
  next.disabled=true;
  next.textContent=current===questions.length-1?'Finish Quiz':'Next Question';
}

function selectAnswer(index,button){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,i)=>{
    if(i===q.correct_option_id)b.classList.add('correct');
  });
  if(index===q.correct_option_id){
    score++;
    button.classList.add('correct');
  }else{
    button.classList.add('wrong');
  }
  document.getElementById('nextBtn').disabled=false;
}

document.getElementById('nextBtn').onclick=()=>{
  if(!answered)return;
  current++;
  if(current<questions.length) showQuestion();
  else showResult();
};

function showResult(){
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('score').textContent=`${score} / ${questions.length}`;
  const pct=Math.round(score/questions.length*100);
  document.getElementById('message').textContent=`Aapka score ${pct}% hai.`;
}

function restartQuiz(){
  current=0; score=0;
  shuffle(questions);
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  showQuestion();
}
loadQuiz();
</script>
</body>
</html>
