<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haryana GK Quiz - Chapter 2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.header,.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:16px;
}

.header{text-align:center}

h1{
  margin:0 0 6px;
  font-size:25px;
}

.subtitle{
  color:#667085;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
}

input[readonly]{
  background:#f2f4f7;
}

.note{
  font-size:13px;
  color:#667085;
  margin-top:12px;
  line-height:1.5;
}

.primary,.restart{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  background:#2563eb;
  color:white;
  width:100%;
  margin-top:18px;
}

.error{
  color:#b42318;
  font-size:14px;
  margin-top:10px;
}

.progress{
  font-size:14px;
  color:#667085;
  margin-bottom:14px;
}

.question{
  font-size:21px;
  font-weight:700;
  line-height:1.45;
  margin-bottom:18px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  border:2px solid #e4e7ec;
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin:10px 0;
  font-size:17px;
  cursor:pointer;
}

.option.correct{
  border-color:#16a34a;
  background:#f0fdf4;
}

.option.wrong{
  border-color:#dc2626;
  background:#fef2f2;
}

.next{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  width:100%;
  margin-top:14px;
  background:#2563eb;
  color:#fff;
}

.next:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.result{
  text-align:center;
}

.score{
  font-size:42px;
  font-weight:800;
  margin:18px 0;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#98a2b3;
  font-size:13px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>हरियाणा GK Quiz</h1>
<div class="subtitle">Chapter 2 • Jaswant Sir</div>
</div>


<!-- STUDENT FORM -->

<div id="formCard" class="card">

<h2>Quiz शुरू करें</h2>

<label>Name *</label>
<input
id="name"
type="text"
placeholder="अपना नाम लिखें"
autocomplete="name"
>

<label>Mobile Number *</label>
<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="10 digit mobile number"
autocomplete="tel"
>

<label>District / City</label>
<input
id="district"
type="text"
placeholder="जिला / शहर"
>

<label>School / Institute</label>
<input
id="school"
type="text"
placeholder="School / Institute"
>

<label>Date</label>
<input
id="date"
type="text"
readonly
>

<label>Attempt No.</label>
<input
id="attempt"
type="text"
readonly
>

<div class="note">
आपकी जानकारी इस quiz attempt के साथ रिकॉर्ड की जा सकती है।
Mobile number केवल quiz record के लिए लिया जा रहा है।
</div>

<div id="formError" class="error"></div>

<button class="primary" onclick="startQuiz()">
Start Quiz
</button>

</div>


<!-- QUIZ -->

<div id="quizCard" class="card hidden">

<div id="progress" class="progress"></div>

<div id="question" class="question"></div>

<div id="options"></div>

<button id="nextBtn" class="next" disabled>
Next Question
</button>

</div>


<!-- RESULT -->

<div id="resultCard" class="card result hidden">

<h2>Quiz Complete 🎉</h2>

<div id="score" class="score"></div>

<p id="message"></p>

<button class="restart" onclick="restartQuiz()">
Try Again
</button>

</div>


<div class="footer">
Haryana GK • Chapter 2
</div>

</div>


<script>

let questions=[];
let current=0;
let score=0;
let answered=false;
let userData={};


/* DATE */

function today(){

const d=new Date();

return d.toLocaleDateString(
'en-IN',
{
day:'2-digit',
month:'2-digit',
year:'numeric'
}
);

}


/* ATTEMPT NUMBER */

function getAttempt(){

const mobile=
document.getElementById('mobile').value.trim();

if(!mobile){
return 1;
}

try{

return Number(
localStorage.getItem(
'haryana_gk_attempt_'+mobile
)||0
)+1;

}catch(e){

return 1;

}

}


/* UPDATE FORM */

function updateForm(){

document.getElementById('date').value=today();

document.getElementById('attempt').value=getAttempt();

}


/* MOBILE CHANGE */

document
.getElementById('mobile')
.addEventListener('input',updateForm);


/* INITIAL FORM */

updateForm();


/* LOAD QUESTIONS */

async function loadQuiz(){

try{

const response=
await fetch('./Chapter2.json');

if(!response.ok){

throw new Error(
'Chapter2.json not found'
);

}

questions=
await response.json();

if(
!Array.isArray(questions) ||
questions.length===0
){

throw new Error(
'No questions found'
);

}

shuffle(questions);

}catch(error){

document.getElementById(
'question'
).textContent=
'Quiz load nahi ho paya.';

console.error(error);

}

}


/* SHUFFLE */

function shuffle(array){

for(
let i=array.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[
array[i],
array[j]
]=[
array[j],
array[i]
];

}

}


/* START QUIZ */

function startQuiz(){

const name=
document
.getElementById('name')
.value
.trim();

const mobile=
document
.getElementById('mobile')
.value
.trim();

const error=
document.getElementById(
'formError'
);


if(!name){

error.textContent=
'Please enter your name.';

return;

}


if(!/^[0-9]{10}$/.test(mobile)){

error.textContent=
'Please enter a valid 10 digit mobile number.';

return;

}


if(questions.length===0){

error.textContent=
'Questions load nahi hue. Page refresh karke try karein.';

return;

}


error.textContent='';


const attempt=
getAttempt();


userData={

name:name,

mobile:mobile,

district:
document
.getElementById('district')
.value
.trim(),

school:
document
.getElementById('school')
.value
.trim(),

date:today(),

attempt:attempt

};


try{

localStorage.setItem(
'haryana_gk_attempt_'+mobile,
String(attempt)
);

}catch(e){}


current=0;

score=0;

shuffle(questions);


document
.getElementById('formCard')
.classList
.add('hidden');


document
.getElementById('quizCard')
.classList
.remove('hidden');


showQuestion();

}


/* SHOW QUESTION */

function showQuestion(){

answered=false;

const q=
questions[current];


document
.getElementById('progress')
.textContent=
`Question ${current+1} / ${questions.length}`;


document
.getElementById('question')
.textContent=
q.question;


const box=
document.getElementById('options');

box.innerHTML='';


q.options.forEach(
function(option,index){

const button=
document.createElement('button');

button.className='option';

button.textContent=
String.fromCharCode(65+index)
+'. '+option;

button.onclick=
function(){

selectAnswer(
index,
button
);

};

box.appendChild(button);

});


const next=
document.getElementById('nextBtn');

next.disabled=true;

next.textContent=
current===
questions.length-1
?
'Finish Quiz'
:
'Next Question';

}


/* ANSWER */

function selectAnswer(
index,
button
){

if(answered){
return;
}

answered=true;

const q=
questions[current];


const buttons=
document.querySelectorAll(
'.option'
);


buttons.forEach(
function(b,i){

if(
i===
q.correct_option_id
){

b.classList.add(
'correct'
);

}

});


if(
index===
q.correct_option_id
){

score++;

button.classList.add(
'correct'
);

}else{

button.classList.add(
'wrong'
);

}


document
.getElementById('nextBtn')
.disabled=false;

}


/* NEXT */

document
.getElementById('nextBtn')
.onclick=function(){

if(!answered){
return;
}

current++;

if(
current<
questions.length
){

showQuestion();

}else{

showResult();

}

};


/* RESULT */

function showResult(){

document
.getElementById('quizCard')
.classList
.add('hidden');


document
.getElementById('resultCard')
.classList
.remove('hidden');


const percentage=
Math.round(
score/questions.length*100
);


document
.getElementById('score')
.textContent=
`${score} / ${questions.length}`;


document
.getElementById('message')
.textContent=
`${userData.name}, आपका score ${percentage}% है। Attempt #${userData.attempt}`;


/* SAVE ATTEMPT LOCALLY */

try{

const oldData=
JSON.parse(
localStorage.getItem(
'haryana_gk_attempts'
)||'[]'
);


oldData.push({

name:userData.name,

mobile:userData.mobile,

district:userData.district,

school:userData.school,

date:userData.date,

attempt:userData.attempt,

totalQuestions:
questions.length,

correctAnswers:
score,

wrongAnswers:
questions.length-score,

percentage:percentage,

completedAt:
new Date().toISOString()

});


localStorage.setItem(
'haryana_gk_attempts',
JSON.stringify(oldData)
);

}catch(e){}

}


/* TRY AGAIN */

function restartQuiz(){

document
.getElementById('resultCard')
.classList
.add('hidden');


document
.getElementById('formCard')
.classList
.remove('hidden');


updateForm();

}


/* START */

loadQuiz();

</script>

</body>
</html>
